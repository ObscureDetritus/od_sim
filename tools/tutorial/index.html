<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial — Obscure Detritus Toolkit</title>
<link rel="stylesheet" href="../../shared/ui.css?v=2">
<style>
#main { grid-template-columns: 240px 1fr; }
#nav { background: var(--panel); border-right: 1px solid var(--edge); overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; background: var(--well); border: 1px solid var(--edge);
  border-radius: 2px; color: var(--text); text-align: left; cursor: pointer; font-size: 11.5px; }
.nav-item:hover { background: var(--well-hover); }
.nav-item.on { background: #181818; border-color: var(--accent); color: var(--value); font-weight: 600; }
.nav-num { color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 18px; }
#content { overflow-y: auto; padding: 24px 32px; max-width: 820px; user-select: text; }
#content h1 { font: 700 22px/1.2 var(--serif); color: var(--value); margin: 0 0 8px; }
#content .sub { color: var(--text-dim); margin: 0 0 18px; font-size: 12px; }
.card { background: var(--well); border: 1px solid var(--edge); border-radius: 2px; padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--value); margin: 0 0 8px; }
.card p { margin: 0 0 8px; line-height: 1.55; color: var(--text); }
.card p:last-child { margin-bottom: 0; }
.card ul { margin: 0; padding-left: 18px; line-height: 1.65; color: var(--text); }
.kbd { display: inline-block; padding: 1px 5px; background: #181818; border: 1px solid var(--well-border); border-radius: 2px; color: var(--value); font-size: 11px; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; font-size: 11.5px; }
.flow .box { padding: 5px 9px; background: #121212; border: 1px solid var(--well-border); color: var(--value); }
.flow .arr { color: var(--text-dim); }
.step-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--edge); }
@media (max-width: 720px) { #main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } #nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--edge); } #content { padding: 16px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></symbol>
</svg>

<div id="app">
  <div id="toolbar">
    <div class="l">
      <a class="tool" href="../../index.html" title="All tools"><svg class="i"><use href="#i-home"/></svg></a>
      <div class="vsep"></div>
      <span style="color:var(--text-dim);font-size:11px;">Toolkit Guide</span>
    </div>
    <div style="color:var(--value);font-weight:600;" id="hdrStep">Tutorial · 1 / 6</div>
    <div class="r">
      <button class="ui-btn" id="bPrev">← Prev</button>
      <button class="ui-btn primary" id="bNext">Next →</button>
    </div>
  </div>

  <div id="main">
    <div id="nav" id="nav"></div>
    <div id="content"></div>
  </div>

  <div id="status">
    <div class="cell"><i class="led on"></i><span>Interactive Walkthrough</span></div>
    <div class="cell grow">Use ← / → arrow keys or click any chapter on the left.</div>
    <div class="cell" id="sProg">1 / 6</div>
  </div>
</div>

<script>
const STEPS = [
  {
    title: '1. Toolkit Overview & Session Flow',
    sub: 'How the four tools connect into one live multi-agent simulation.',
    toolUrl: '../../index.html',
    toolLabel: 'Open Toolkit Hub',
    html: `
      <div class="card">
        <h2>The Pipeline</h2>
        <p>Each tool creates one piece of the simulation and saves it into your shared browser <b>Session</b>:</p>
        <div class="flow">
          <span class="box">World Eater (Lore)</span><span class="arr">+</span>
          <span class="box">MapGen (Space &amp; Objects)</span><span class="arr">+</span>
          <span class="box">Soul Moulder (Characters &amp; Narrator)</span><span class="arr">→</span>
          <span class="box">Play (3D Simulation)</span>
        </div>
        <p>Every tool has a <b>Save Session</b> button in the top-right toolbar. Anything saved to the session is immediately available in Play. You can also export the entire setup as a single <code>.odsession.json</code> file and reload it anytime.</p>
      </div>
      <div class="card">
        <h2>Privacy &amp; API Keys</h2>
        <p>No OpenRouter API key is ever stored in the repository or included in exported <code>.odsession.json</code> files. You enter your own key inside <b>Play → API</b> (stored strictly in your browser), or use <b>Dry-Run ($0.00)</b> to test offline without any key.</p>
      </div>`
  },
  {
    title: '2. World Eater (Shared Lore)',
    sub: 'Write the collective facts every character knows when they spawn.',
    toolUrl: '../worldeater/index.html',
    toolLabel: 'Open World Eater →',
    html: `
      <div class="card">
        <h2>What It Does</h2>
        <p><b>World Eater</b> builds <code>world.md</code> — a numbered list of collective facts injected into every character's system prompt during the simulation.</p>
        <ul>
          <li>Type a fact in the <b>Entry</b> box and press <span class="kbd">Enter</span> to add it (<span class="kbd">Shift+Enter</span> for a new line).</li>
          <li>Drag the grip handle on any entry to reorder, or click the text to edit in place.</li>
          <li>Click <b>Save Session</b> (it also auto-syncs as you edit) so Play immediately reads your world facts.</li>
          <li>If the shared World Eater server is reachable, edits sync live across collaborators; otherwise it works seamlessly offline in your browser.</li>
        </ul>
      </div>`
  },
  {
    title: '3. MapGen (Floors & Abstract Objects)',
    sub: 'Draw architectural grids, stack vertical floors, and place custom named objects.',
    toolUrl: '../mapgen/index.html',
    toolLabel: 'Open MapGen →',
    html: `
      <div class="card">
        <h2>Drawing &amp; Mouse-Wheel Controls</h2>
        <ul>
          <li><b>Brushes (<span class="kbd">1</span>–<span class="kbd">6</span>):</b> Empty, Wall, Floor, Door, Corridor, Stairs.</li>
          <li><b>Tools:</b> Pencil (<span class="kbd">B</span>), Rectangle (<span class="kbd">R</span>), Room (<span class="kbd">M</span>), Fill (<span class="kbd">F</span>), and <b>Abstract Object (<span class="kbd">O</span>)</b>.</li>
          <li><span class="kbd">Mouse Wheel</span> zooms / scales the grid view around your cursor.</li>
          <li><span class="kbd">Shift + Wheel</span> switches vertical <b>Floors</b> (<code>F-3</code> to <code>F+5</code>), with a faint ghost of the floor below to help align walls and stairs.</li>
          <li><span class="kbd">Alt + Wheel</span> (or scrolling over Width/Height inputs) resizes the grid dimensions.</li>
          <li><span class="kbd">Space + Drag</span> or middle-click drag pans the canvas; <span class="kbd">0</span> resets the view.</li>
        </ul>
      </div>
      <div class="card">
        <h2>Abstract Objects (Table, Book, Blank...)</h2>
        <p>Select the <b>Object tool (<span class="kbd">O</span>)</b> or click a preset (including <b>blank</b>) to name any custom object (<code>table</code>, <code>book</code>, <code>chronometer</code>, <code>tape</code>, etc.):</p>
        <ul>
          <li><b>Walkable:</b> controls whether agents can step onto this cell.</li>
          <li><b>Pickable:</b> allows agents in Play to pick up the object into their inventory and drop it elsewhere.</li>
          <li><b>Interactive:</b> marks the object as inspectable/usable in agent prompts, along with your optional <b>Info</b> description.</li>
          <li>Click a cell to place/select an object; <b>right-click</b> removes it. Click <b>Save Session</b> (<span class="kbd">Ctrl+S</span>) when ready.</li>
        </ul>
      </div>`
  },
  {
    title: '4. Soul Moulder (Characters & Colors)',
    sub: 'Author character sheets, assign marker colors, and build a multi-soul cast.',
    toolUrl: '../soulmoulder/index.html',
    toolLabel: 'Open Soul Moulder →',
    html: `
      <div class="card">
        <h2>Designing a Soul</h2>
        <ul>
          <li>Fill out <b>Entity ID</b>, <b>System Role</b>, <b>Marker Color</b> (dot color shown on the 3D Play map), and <b>Objective</b>.</li>
        <li>To customize the omniscient narrator voice, create or import a soul with <code>Entity ID: NARRATOR</code>.</li>
          <li>Set the <b>Keith Johnstone Base Status (1–10)</b>, status modifiers, relational dynamics, secrets, linguistic tone, and pre-loaded memories.</li>
          <li>Live Markdown preview updates on the right in the exact <code>soul_template.md</code> format.</li>
        </ul>
      </div>
      <div class="card">
        <h2>Session Cast (Multiple Souls)</h2>
        <ul>
          <li>Click <b>Save to Session</b> (<span class="kbd">Ctrl+S</span>) to store the current character into the active session cast.</li>
          <li>Use the <b>Session Cast</b> list at the top to switch between saved souls, toggle them on/off for Play, or remove them.</li>
          <li>Click <b>+ Load .md files into Session</b> to batch-import multiple existing <code>soul_*.md</code> files at once.</li>
        </ul>
      </div>`
  },
  {
    title: '5. Play (3D Simulation & API)',
    sub: 'Run the live multi-agent simulation on your 3D greyscale map.',
    toolUrl: '../play/index.html',
    toolLabel: 'Open Play →',
    html: `
      <div class="card">
        <h2>API Key &amp; Dry-Run Mode</h2>
        <ul>
          <li>Click <b>API</b> in the top-right toolbar to enter your <b>OpenRouter API key</b>, pick a model (DeepSeek V3, Mistral Small 24B, Qwen3 30B-A3B, Gemma 4 26B, etc.), and set a USD budget cap.</li>
          <li>To run on a local machine (Ollama / <code>llama-server</code>), set the API Endpoint to <code>http://localhost:11434/v1/chat/completions</code> and leave the key blank.</li>
          <li>Keep <b>Dry-Run (Mock)</b> switched ON to test movement, object pickup, and UI layout for <b>$0.00</b> before spending credits.</li>
        </ul>
      </div>
      <div class="card">
        <h2>3D Viewport &amp; Controls</h2>
        <ul>
          <li><b>Drag</b> to orbit the 3D greyscale architectural view from above; <b>Scroll</b> to zoom; use <b>3D ISO / TOP-DOWN / LOW POV / TOWER</b> buttons in the bottom-left.</li>
          <li>Characters appear as colored dot markers with their <code>ID status/10</code> badge; click any character or map object to inspect thoughts, inventory, or force their turn.</li>
          <li>Press <span class="kbd">Space</span> or <b>Step 1 Tick</b> to advance manually, toggle <b>Auto</b> for continuous pacing, or type into the event box to inject anomalies live.</li>
          <li>Use <b>Save → Download Transcript (.md / .json)</b> to archive your run.</li>
        </ul>
      </div>`
  }
];

let cur = 0;
const nav = document.getElementById('nav'), content = document.getElementById('content');

function render() {
  nav.innerHTML = '';
  STEPS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'nav-item' + (i === cur ? ' on' : '');
    b.innerHTML = `<span class="nav-num">0${i + 1}</span><span>${s.title.replace(/^\d+\.\s*/, '')}</span>`;
    b.onclick = () => { cur = i; render(); };
    nav.appendChild(b);
  });
  const s = STEPS[cur];
  hdrStep.textContent = `Tutorial · ${cur + 1} / ${STEPS.length}`;
  sProg.textContent = `${cur + 1} / ${STEPS.length}`;
  bPrev.disabled = cur === 0;
  bNext.disabled = cur === STEPS.length - 1;
  content.innerHTML = `
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>
    ${s.html}
    <div class="step-footer">
      <a class="ui-btn primary" href="${s.toolUrl}" style="text-decoration:none">${s.toolLabel}</a>
      <div style="display:flex;gap:6px;">
        <button class="ui-btn" ${cur === 0 ? 'disabled' : ''} onclick="go(${cur - 1})">← Previous</button>
        <button class="ui-btn" ${cur === STEPS.length - 1 ? 'disabled' : ''} onclick="go(${cur + 1})">Next Step →</button>
      </div>
    </div>`;
  content.scrollTop = 0;
}

function go(i) { cur = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }
bPrev.onclick = () => go(cur - 1);
bNext.onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

render();
</script>
</body>
</html>
