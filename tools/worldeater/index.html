<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Eater</title>
<link rel="stylesheet" href="../../shared/ui.css?v=2">
<style>
/* Carriage on the shore, inverted and greyed (made in Photoshop), with a halftone screen. */
:root { --chrome: transparent; --panel: transparent; }
html, body { background: url(../../shared/bg-worldeater.jpg?v=3) center / cover fixed #000; }
#app { text-shadow: 0 0 4px #000, 0 0 2px #000; }
#main { grid-template-columns: minmax(0, 1fr) minmax(0, 44%); }
#form { overflow-y: auto; border-right: 1px solid var(--edge); }
#preview { overflow: auto; padding: 12px 14px; }
#md { margin: 0; font: 11px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: break-word; user-select: text; }
#md .hd { color: var(--value); }
#toolbar .title { color: var(--value); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { grid-template-columns: 76px minmax(0, 1fr); align-items: start; }
.row > label { padding-top: 4px; }
textarea.ui-field { height: auto; min-height: 22px; padding: 3px 6px; resize: none; line-height: 1.35; display: block; overflow: hidden; }
.ui-field::placeholder { color: #4a4a4a; }
#adder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
#adder textarea { min-height: 52px; }
#adder .ui-btn { height: 26px; }
#entries { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 14px 26px minmax(0, 1fr) 22px; gap: 4px; align-items: start; padding: 3px 0;
  border-bottom: 1px solid #161616; }
.entry:last-child { border-bottom: 0; }
.entry .grip { color: #4a4a4a; cursor: grab; padding-top: 4px; display: flex; justify-content: center; }
.entry .grip:hover { color: var(--text-dim); }
.entry .n { color: var(--text-dim); text-align: right; padding-top: 4px; line-height: 1.35; font-variant-numeric: tabular-nums; }   /* same line box as the fact text: border 1 + padding 3 */
.entry textarea.ui-field { background: transparent; border-color: transparent; }
.entry textarea.ui-field:hover { border-color: var(--edge); }
.entry textarea.ui-field:focus { background: var(--well); border-color: var(--select); }
.entry .x { width: 22px; height: 22px; padding: 0; background: transparent; border: 0; border-radius: 2px; color: var(--text-dim);
  display: inline-flex; align-items: center; justify-content: center; }
.entry .x:hover { background: var(--button-hover); color: var(--text); }
.entry.dragging { opacity: .35; }
.entry.over { box-shadow: inset 0 2px 0 var(--accent); }
.entry.over.below { box-shadow: inset 0 -2px 0 var(--accent); }
#fIntro { background: transparent; border-color: transparent; padding-left: 0; color: var(--text); }   /* read-only */
#keyNote { color: var(--text-dim); padding-top: 4px; }
body.ro .entry .grip, body.ro .entry .x { visibility: hidden; }
body.ro .entry textarea.ui-field:hover { border-color: transparent; }
#dConfirm { background: #0a0a0a; color: var(--text); border: 1px solid var(--edge); border-radius: 2px; padding: 14px 16px 12px;
  width: min(360px, calc(100vw - 32px)); box-shadow: 0 8px 30px rgba(0,0,0,.6); }
#dConfirm::backdrop { background: rgba(0,0,0,.6); }
#dConfirm p { margin: 0 0 6px; color: var(--value); font-weight: 600; }
#dConfirm blockquote { margin: 0 0 14px; color: var(--text-dim); max-height: 7.5em; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
#dConfirm .btns { display: flex; justify-content: flex-end; gap: 6px; }
@media (max-width: 760px) { #main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; } #form { border-right: 0; border-bottom: 1px solid var(--edge); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></symbol>
  <symbol id="i-new" viewBox="0 0 16 16"><path d="M4 1.5h5.5L12.5 4.5V14.5H4z M9.5 1.5v3h3"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><path d="M1.5 4.5v8.5h13V6H7.5L6 4.5z M1.5 4.5V3h4l1 1.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2v8 M4.5 7L8 10.5 11.5 7 M2.5 13.5h11"/></symbol>
  <symbol id="i-plus" viewBox="0 0 12 12"><path d="M3 6h6 M6 3v6"/></symbol>
  <symbol id="i-x" viewBox="0 0 12 12"><path d="M3.5 3.5l5 5 M8.5 3.5l-5 5"/></symbol>
  <symbol id="i-grip" viewBox="0 0 12 12"><g stroke-width="2"><path d="M4.5 3h0 M7.5 3h0 M4.5 6h0 M7.5 6h0 M4.5 9h0 M7.5 9h0"/></g></symbol>
</svg>

<dialog id="dConfirm">
  <form method="dialog">
    <p>Delete this entry for everyone?</p>
    <blockquote id="dText"></blockquote>
    <div class="btns"><button class="ui-btn" value="cancel">Cancel</button><button class="ui-btn primary" value="ok">Delete</button></div>
  </form>
</dialog>

<div id="app">
  <div id="toolbar">
    <div class="l">
      <a class="tool" href="../../index.html" title="All tools"><svg class="i"><use href="#i-home"/></svg></a>
      <div class="vsep"></div>
      <button class="tool" id="bNew" title="New world"><svg class="i"><use href="#i-new"/></svg></button>
      <button class="tool" id="bOpen" title="Open a world .md"><svg class="i"><use href="#i-open"/></svg></button>
      <input type="file" id="file" accept=".md,.markdown,.txt" hidden>
    </div>
    <div class="title" id="title">World Eater</div>
    <div class="r">
      <button class="ui-btn primary" id="bExport"><svg class="i"><use href="#i-down"/></svg>Export</button>
      <div class="menu" id="mExport">
        <button data-x="copy">Copy markdown</button>
        <button data-x="md">Download world.md</button>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="form">
      <div class="section" id="secShared">
        <div class="sec-head">Shared</div>
        <div class="sec-body">
          <div class="row"><label title="Passphrase for editing the shared world">Key</label>
            <input class="ui-field" id="fKey" type="password" autocomplete="current-password" placeholder="Needed to edit or remove entries"></div>
          <div class="row"><label></label><div id="keyNote"></div></div>
        </div>
      </div>
      <div class="section">
        <div class="sec-body">
          <div class="row"><label title="Tells the agents what this list is">Info</label><textarea class="ui-field" id="fIntro" rows="2" readonly tabindex="-1"></textarea></div>
        </div>
      </div>
      <div class="section">
        <div class="sec-head">Entry</div>
        <div class="sec-body">
          <div id="adder">
            <textarea class="ui-field" id="fNew" rows="2" placeholder="The well hums at night. Anyone who drinks from it forgets one room."
              title="Enter adds the entry · Shift+Enter for a new line"></textarea>
            <button class="ui-btn primary" id="bAdd" title="Add (Enter)"><svg class="i s"><use href="#i-plus"/></svg>Add</button>
          </div>
          <div id="entries"></div>
        </div>
      </div>
    </div>
    <div id="preview"><pre id="md"></pre></div>
  </div>

  <div id="status">
    <div class="cell"><i class="led"></i><span id="sCount"></span></div>
    <div class="cell">world.md</div>
    <div class="cell grow" id="sMsg"></div>
    <div class="cell"><i class="led" id="sLed"></i><span id="sMode"></span></div>
    <div class="cell" id="sWords"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- config
// The shared world lives on the World Eater API (server/worldeater_api.py). ?api=URL overrides the address.
const LOCAL_HOSTS = ['localhost', '127.0.0.1', ''];
const API = (new URLSearchParams(location.search).get('api')
  || (LOCAL_HOSTS.includes(location.hostname) ? 'http://127.0.0.1:8787' : 'https://api.declino.systems')).replace(/\/$/, '');
const KEY = 'od.worldeater.v2', KEY_PASS = 'od.worldeater.key';
const DEFAULT_INTRO = 'Collective knowledge: facts every agent already knows before arriving in the play.';
const POLL_MS = 4000, TYPE_MS = 500;

// ---------------------------------------------------------------- model
// S.facts = [{ id, text }]. The server is the truth; this copy is the last world it sent (also cached for offline use).
const blank = () => ({ rev: 0, title: 'WORLD', intro: DEFAULT_INTRO, facts: [] });
const rid = () => Math.random().toString(16).slice(2, 14);
let S = blank();
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.facts)) S = { ...blank(), ...saved };
  else {   // carry over a list from the old browser-only version
    const old = JSON.parse(localStorage.getItem('od.worldeater.v1'));
    if (old && Array.isArray(old.facts)) S = { ...blank(), title: old.title, intro: old.intro, facts: old.facts.map(t => ({ id: rid(), text: t })) };
  }
} catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
let pass = ''; try { pass = localStorage.getItem(KEY_PASS) || ''; } catch {}

// mode: 'connecting' | 'shared' | 'local' (server unreachable: edits stay in this browser)
let mode = 'connecting', locked = true, canEdit = false, publicAdd = false;

// the same edits the server understands, applied here first so typing feels instant
function applyOp(w, op) {
  const at = id => w.facts.findIndex(f => f.id === id);
  if (op.op === 'add') w.facts.push({ id: op.id || rid(), text: op.text.trim() });
  if (op.op === 'edit' && at(op.id) >= 0) w.facts[at(op.id)].text = op.text;
  if (op.op === 'remove' && at(op.id) >= 0) w.facts.splice(at(op.id), 1);
  if (op.op === 'move' && at(op.id) >= 0) { const [f] = w.facts.splice(at(op.id), 1); w.facts.splice(Math.min(op.to, w.facts.length), 0, f); }
  if (op.op === 'meta') { if ('title' in op) w.title = op.title; if ('intro' in op) w.intro = op.intro; }
  if (op.op === 'replace') { w.facts = op.facts.map(t => ({ id: rid(), text: t })); }
}

// ---------------------------------------------------------------- server
const queue = []; let sending = false;
const headers = () => ({ 'Content-Type': 'application/json', ...(pass ? { 'X-World-Key': pass } : {}) });

function send(op) {
  applyOp(S, op); persist(); renderAll();
  queue.push(op); flush();   // offline: stays queued until the server is back
}
async function flush() {
  if (sending || !queue.length || mode !== 'shared') return;
  sending = true;
  const op = queue.shift();
  try {
    const r = await fetch(API + '/world/ops', { method: 'POST', headers: headers(), body: JSON.stringify(op) });
    const body = await r.json().catch(() => ({}));
    if (r.ok) { if (!queue.length) adopt(body); }
    else if (r.status === 401) { queue.length = 0; canEdit = false; note('That key was refused, so your change was not saved.'); await pull(true); }
    else if (r.status === 429) { queue.length = 0; flash(body.error || 'Too many changes at once. Try again in a minute.'); await pull(true); }
    else if (body.world) { if (body.error && /limited/.test(body.error)) flash(body.error); if (!queue.length) adopt(body.world); }   // e.g. someone removed that fact first
  } catch { queue.unshift(op); setMode('local'); }
  sending = false;
  if (queue.length && mode === 'shared') flush();
}
async function pull(force) {
  if (sending || queue.length || pending.size) return;
  try {
    const r = await fetch(`${API}/world${force ? '' : '?since=' + S.rev}`, { cache: 'no-store' });
    if (r.status === 200) adopt(await r.json());
    if (mode !== 'shared') setMode('shared');
  } catch { setMode('local'); }
}
async function connect() {
  try {
    const h = await (await fetch(API + '/health', { cache: 'no-store' })).json();
    locked = !!h.locked; publicAdd = !!h.public_add;
    canEdit = !locked || (pass && (await fetch(API + '/auth', { headers: headers(), cache: 'no-store' })).ok);
    setMode('shared');
    if (queue.length) flush(); else await pull(true);
  } catch { setMode('local'); }
  keyNote();
}

// take the server's world, keeping whatever is still being typed here
function adopt(w) {
  const focus = document.activeElement, fid = focus?.closest?.('.entry')?.dataset.id;
  const sel = focus && 'selectionStart' in focus ? [focus.selectionStart, focus.selectionEnd] : null;
  S = w;
  for (const [id, text] of pending) { const f = S.facts.find(x => x.id === id); if (f) f.text = text; }
  persist(); renderAll();
  if (fid) { const ta = document.querySelector(`.entry[data-id="${fid}"] textarea`); if (ta) { ta.focus(); if (sel) ta.setSelectionRange(...sel); } }
  else if (focus && focus.id && focus !== document.body) focus.focus();
}

// typing is batched: one edit per pause, not per key
const pending = new Map(), timers = new Map();
function typed(id, text) {
  const f = S.facts.find(x => x.id === id); if (f) f.text = text;
  pending.set(id, text); clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => commitEdit(id), TYPE_MS)); preview();
}
function commitEdit(id) {
  clearTimeout(timers.get(id)); if (!pending.has(id)) return;
  const text = pending.get(id); pending.delete(id);
  queue.push({ op: 'edit', id, text }); flush(); persist();
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle('ro', m === 'shared' && !canEdit);
  sLed.classList.toggle('on', m === 'shared');
  sMode.textContent = m === 'shared' ? (canEdit ? 'shared' : publicAdd ? 'shared · add only' : 'shared · read only') : m === 'local' ? 'offline · this browser only' : 'connecting…';
  sMode.title = m === 'local' ? `Can't reach ${API}. Changes stay in this browser until it's back.` : API;
  [bNew, bOpen].forEach(b => b.disabled = m === 'shared' && !canEdit);
  fNew.readOnly = m === 'shared' && !canEdit && !publicAdd;
  fNew.maxLength = m === 'shared' ? 1000 : 4000;   // the server caps visitors' text at 1000 characters
  adder.style.display = fNew.readOnly ? 'none' : '';
  keyNote();
}
function note(t) { keyNoteEl.textContent = t; }
let flashTimer = 0;
function flash(t) { sMsg.textContent = t; clearTimeout(flashTimer); flashTimer = setTimeout(() => sMsg.textContent = '', 6000); }
const keyNoteEl = document.getElementById('keyNote');
function keyNote() {
  secShared.style.display = mode === 'shared' && locked ? '' : 'none';
  if (mode === 'shared' && locked) note(
    canEdit ? 'Key accepted. You can edit, reorder and remove entries.'
    : pass ? (publicAdd ? 'Wrong key. You can still add entries.' : 'Wrong key. Read only.')
    : publicAdd ? 'Anyone can add entries. The key is needed to edit, reorder or remove them.' : 'Read only. Enter the key to edit.');
}
fKey.value = pass;
fKey.onchange = async () => {
  pass = fKey.value.trim(); try { pass ? localStorage.setItem(KEY_PASS, pass) : localStorage.removeItem(KEY_PASS); } catch {}
  await connect();
};

// ---------------------------------------------------------------- markdown
function toMarkdown() {
  const L = [`# ${S.title.trim() || 'WORLD'}`, ''];
  if (S.intro.trim()) L.push(S.intro.trim(), '');
  S.facts.forEach((f, i) => {
    const lead = `${i + 1}. `, pad = ' '.repeat(lead.length);       // continuation lines align under the text
    L.push(lead + f.text.trim().replace(/\r/g, '').split('\n').join('\n' + pad));
  });
  return L.join('\n').replace(/\n+$/, '') + '\n';
}
function fromMarkdown(text) {
  const out = { title: 'WORLD', intro: '', facts: [] }, intro = [];
  let cur = null;
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    let m;
    if ((m = raw.match(/^#\s+(.*)$/)) && !out.facts.length) { out.title = m[1].trim(); continue; }
    if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { cur = [m[1]]; out.facts.push(cur); continue; }
    if (cur && /^\s+\S/.test(raw)) { cur.push(raw.trim()); continue; }
    if (!raw.trim()) { cur = null; continue; }
    if (!out.facts.length) intro.push(raw.trim());
  }
  out.intro = intro.join('\n');
  out.facts = out.facts.map(lines => lines.join('\n'));
  return out;
}

// ---------------------------------------------------------------- list
const $ = s => document.querySelector(s);
const autosize = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
let dragFrom = -1;

function renderEntries() {
  const box = $('#entries'); box.innerHTML = '';
  const ro = mode === 'shared' && !canEdit;
  S.facts.forEach((fact, i) => {
    const row = document.createElement('div'); row.className = 'entry'; row.dataset.i = i; row.dataset.id = fact.id;
    row.innerHTML = `<span class="grip" draggable="true" title="Drag to reorder"><svg class="i s"><use href="#i-grip"/></svg></span>
      <span class="n">${i + 1}.</span><textarea class="ui-field" rows="1"></textarea>
      <button class="x" title="Remove"><svg class="i s"><use href="#i-x"/></svg></button>`;
    const ta = row.querySelector('textarea'); ta.value = fact.text; ta.readOnly = ro; ta.maxLength = 1000;
    ta.oninput = () => { typed(fact.id, ta.value); autosize(ta); };
    ta.onblur = () => { if (ro) return; commitEdit(fact.id); if (!ta.value.trim()) send({ op: 'remove', id: fact.id }); };   // emptied = removed
    row.querySelector('.x').onclick = async () => {
      if (!(await confirmDelete(ta.value))) return;
      pending.delete(fact.id); send({ op: 'remove', id: fact.id });
    };
    const grip = row.querySelector('.grip');
    grip.ondragstart = e => { dragFrom = i; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i)); e.dataTransfer.setDragImage(row, 10, 10); };
    grip.ondragend = () => { dragFrom = -1; box.querySelectorAll('.entry').forEach(r => r.classList.remove('dragging', 'over', 'below')); };
    row.ondragover = e => {
      if (dragFrom < 0) return; e.preventDefault();
      const below = e.offsetY > row.offsetHeight / 2;
      box.querySelectorAll('.entry').forEach(r => r.classList.remove('over', 'below'));
      row.classList.add('over'); row.classList.toggle('below', below);
    };
    row.ondrop = e => {
      e.preventDefault(); if (dragFrom < 0) return;
      let to = i + (row.classList.contains('below') ? 1 : 0);
      const from = dragFrom; dragFrom = -1; if (from < to) to--;
      if (from !== to) send({ op: 'move', id: S.facts[from].id, to }); else renderEntries();
    };
    box.appendChild(row);
    requestAnimationFrame(() => autosize(ta));
  });
}

// asks before deleting; text goes in as plain text, never as HTML
function confirmDelete(text) {
  dText.textContent = text.length > 300 ? text.slice(0, 300) + '…' : text;
  return new Promise(resolve => {
    dConfirm.returnValue = 'cancel';
    dConfirm.addEventListener('close', () => resolve(dConfirm.returnValue === 'ok'), { once: true });
    dConfirm.showModal();
    dConfirm.querySelector('button[value="cancel"]').focus();   // Enter or Esc never deletes by accident
  });
}

function addFact() {
  const v = $('#fNew').value.trim();
  if (!v) { $('#fNew').focus(); return; }
  $('#fNew').value = ''; autosize($('#fNew'));
  send({ op: 'add', text: v, id: rid() });
  $('#entries').lastElementChild?.scrollIntoView({ block: 'nearest' });
  $('#fNew').focus();
}
bAdd.onclick = addFact;
fNew.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addFact(); } };
fNew.oninput = () => autosize(fNew);

// ---------------------------------------------------------------- preview, status
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
function preview() {
  const md = toMarkdown();
  $('#md').innerHTML = md.split('\n').map(l => l.startsWith('#') ? `<span class="hd">${esc(l)}</span>` : esc(l)).join('\n');
  $('#sCount').innerHTML = `<b>${S.facts.length}</b>&nbsp;${S.facts.length === 1 ? 'entry' : 'entries'}`;
  $('#sWords').innerHTML = `<b>${S.facts.map(f => f.text).join(' ').match(/\S+/g)?.length || 0}</b>&nbsp;words`;
}
function renderAll() {
  fIntro.value = S.intro; autosize(fIntro);   // read-only: set on the server
  renderEntries(); preview();
}

// ---------------------------------------------------------------- toolbar
const shareWarn = () => mode === 'shared' ? ' This replaces the shared world for everyone.' : '';
bNew.onclick = () => {
  if (S.facts.length && !confirm('Discard this world and start a new one?' + shareWarn())) return;
  send({ op: 'replace', facts: [] });
};
bOpen.onclick = () => file.click();
file.onchange = async () => {
  const f = file.files[0]; file.value = ''; if (!f) return;
  const w = fromMarkdown(await f.text());
  if (mode === 'shared' && !confirm(`Open ${f.name}?` + shareWarn())) return;
  send({ op: 'replace', facts: w.facts });   // the file's heading and intro are ignored
};
bExport.onclick = e => { e.stopPropagation(); mExport.classList.toggle('open'); };
document.addEventListener('click', () => mExport.classList.remove('open'));
mExport.onclick = async e => {
  const x = e.target.dataset.x; if (!x) return;
  const md = toMarkdown();
  if (x === 'copy') { try { await navigator.clipboard.writeText(md); } catch {} }
  if (x === 'md') {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
    a.download = 'world.md'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
};

renderAll();
setMode('connecting');
connect();
setInterval(() => { if (mode === 'shared') pull(); else connect(); }, POLL_MS);
fNew.focus();
</script>
</body>
</html>
